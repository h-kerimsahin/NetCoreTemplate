name: Publish KrmShn Template Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      prerelease:
        description: "Is this a pre-release?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Template + Upload to Release
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ver = if ('${{ github.event.inputs.version }}') { '${{ github.event.inputs.version }}' } `
                 else { $env:GITHUB_REF_NAME -replace '^v', '' }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using version: $ver"

      - name: Build template ZIP
        shell: pwsh
        run: |
          ./build-template.ps1

      - name: Verify artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path ./KrmShnNetCoreBackendProject.zip)) {
            Write-Error "Template ZIP not found!"
            exit 1
          }
          $size = (Get-Item ./KrmShnNetCoreBackendProject.zip).Length / 1KB
          Write-Host ("Template ZIP size: {0:N1} KB" -f $size)

      - name: Generate release notes
        shell: pwsh
        run: |
          $body = @"
          ## 🚀 KrmShn Net Core Backend Project - v${{ steps.version.outputs.version }}

          Production Grade **Clean Architecture** .NET 11 Backend Template Visual Studio'da tek tıkla kullanmak için hazır.

          ### 📦 Indirilecekler

          | Dosya | Aciklama |
          |-------|----------|
          | **KrmShnNetCoreBackendProject.zip** | Visual Studio Project Template (ana paket) |
          | **install-template.bat** (ZIP icinde) | Tek tikla VS template kurulum scripti |

          ### 🔧 Kurulum (2 yontem)

          #### Yontem 1 - Manuel Kopyala
          1. ZIP dosyasini indirin
          2. Asagidaki klasore kopyalayin (VS 2022):
             ```
             %USERPROFILE%\Documents\Visual Studio 2022\Templates\ProjectTemplates\
             ```
          3. Visual Studio'yu YENIDEN BASLATIN
          4. Create a new project > arama: **KrmShn** > **KrmShn Net Core Backend Project** sec

          #### Yontem 2 - Otomatik Kurulum Scripti
          ZIP'i cikartin, icindeki `install-template.bat` dosyasini CIFT TIKLAYIN.

          ### 🛠️ Projeyi ilk calistirma
          ```bash
          dotnet restore
          cd Presentation/<ProjeAdi>.Api
          dotnet ef database update
          dotnet run
          ```
          > Swagger:  http://localhost:5084/swagger
          > Default SuperAdmin (SADECE Development):
          >  E-posta: `superadmin@netcoretemplate.com`  |  Sifre: `Qwerty123!`

          ### ✨ Template icindeki ozellikler
          - Clean Architecture 4 katman (Domain / Application / Infrastructure / Api)
          - JWT (15dk Access + 14g Refresh) + 2FA + RBAC (Role + Permission)
          - SecurityStamp middleware, 3 katmanli Rate Limit, Idempotency Filter
          - CORS Secure-by-Default, Upload Path Traversal Korumasi
          - Hangfire Dashboard + Recurring Jobs, SignalR Notification Hub
          - OData v4 ($filter, $select, $orderby, $expand)
          - OpenTelemetry + Prometheus /metrics, Serilog Structured Logging
          - Soft-Delete + Audit Entries + Geri yukleme (Restore)
          - File Storage (Local / Azure Blob), Email Service (SMTP)
          - 43+ Endpoint + Swagger UI + Scalar UI (Modern)

          Yayin: GitHub Actions ile otomatik olusturuldu 🔧
          "@
          Set-Content -Path ./RELEASE_NOTES.md -Value $body -Encoding utf8

      - name: Create GitHub Release + Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: KrmShn Template v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: ./RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            ./KrmShnNetCoreBackendProject.zip
            ./install-template.bat
